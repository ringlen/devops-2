apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: library-health
  namespace: monitoring
spec:
  jobName: library-health
  interval: 15s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - http://auth.library.svc:8081/health
        - http://catalog.library.svc:8082/health
        - http://ebook.library.svc:8083/health
        - http://audio.library.svc:8084/health
        - http://libraryfav.library.svc:8085/health
        - http://billing.library.svc:8086/health
      labels:
        project: library