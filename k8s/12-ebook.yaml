apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebook
  namespace: library
  labels:
    app: ebook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ebook
  template:
    metadata:
      labels:
        app: ebook
    spec:
      containers:
        - name: ebook
          image: library-ebook:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ebook
  namespace: library
spec:
  selector:
    app: ebook
  ports:
    - port: 8083
      targetPort: 8083