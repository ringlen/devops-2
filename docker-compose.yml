services:
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: auth
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: catalog
    volumes:
      - catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  libraryfav-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: libraryfav
    volumes:
      - libraryfav_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: billing
    volumes:
      - billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: auth-db
      DB_NAME: auth
      DB_USER: postgres
      DB_PASSWORD: secret
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: docker/catalog/Dockerfile
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_HOST: catalog-db
      DB_NAME: catalog
      DB_USER: postgres
      DB_PASSWORD: secret
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: unless-stopped

  ebook:
    build:
      context: .
      dockerfile: docker/ebook/Dockerfile
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
    restart: unless-stopped

  audio:
    build:
      context: .
      dockerfile: docker/audio/Dockerfile
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
    restart: unless-stopped

  libraryfav:
    build:
      context: .
      dockerfile: docker/libraryfav/Dockerfile
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DB_HOST: libraryfav-db
      DB_NAME: libraryfav
      DB_USER: postgres
      DB_PASSWORD: secret
    depends_on:
      libraryfav-db:
        condition: service_healthy
    restart: unless-stopped

  billing:
    build:
      context: .
      dockerfile: docker/billing/Dockerfile
    ports:
      - "8086:8086"
    environment:
      PORT: 8086
      DB_HOST: billing-db
      DB_NAME: billing
      DB_USER: postgres
      DB_PASSWORD: secret
    depends_on:
      billing-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  auth_data:
  catalog_data:
  libraryfav_data:
  billing_data: